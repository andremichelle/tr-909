<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
    <defs>
        <filter id="blur-active">
            <feGaussianBlur stdDeviation="1.5"/>
        </filter>
    </defs>
    <g filter="url(#blur-active)">
        <rect x="0" y="0" width="20" height="20" stroke="black" fill="none"/>
        <rect x="1" y="1" width="18" height="18" stroke="none" fill="#996b6b"/>
        <rect x="3" y="3" width="14" height="14" stroke="none" fill="#DDa5a5"/>
        <circle cx="10" cy="10" r="4" fill="#ff0000" fill-opacity="0.6"/>
        <circle cx="10" cy="10" r="3" fill="#ff1111" fill-opacity="1"/>
        <circle cx="10" cy="9" r="1.5" fill="#FFCCCC" fill-opacity="1"/>
    </g>
</svg>